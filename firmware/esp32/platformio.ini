; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:embo]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = default.csv
upload_protocol = esptool
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lovyan03/LovyanGFX @ ^1.1.16
	teemuatlut/TMCStepper @ ^0.7.3
	robtillaart/AD9833@^0.4.5
	h2zero/NimBLE-Arduino @ ^1.4.2

; BENCH-ONLY build — skips homing entirely (see BENCH_NO_HOMING in
; motors.cpp) so the UI/BLE can be exercised with no motors or limit
; switches connected at all. NEVER flash this to a real device — there is
; no on-hardware indication this is running other than the serial/BLE log
; line and a banner on the set-target screen. Build/upload explicitly with
; `pio run -e embo_bench -t upload`; `pio run` (no -e) still targets the
; real `embo` env above.
[env:embo_bench]
extends = env:embo
build_flags =
	${env:embo.build_flags}
	-DBENCH_NO_HOMING