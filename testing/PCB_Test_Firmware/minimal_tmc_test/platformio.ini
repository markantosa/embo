; Throwaway minimal TMC2209 UART test — isolates whether the "no reply" issue
; is in the full firmware's complexity (BLE, esp_timer step ISRs, homing) or
; the physical board itself. No BLE, no timers, nothing else running.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
	teemuatlut/TMCStepper @ ^0.7.3
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM=0
monitor_dtr = 1
monitor_rts = 1
