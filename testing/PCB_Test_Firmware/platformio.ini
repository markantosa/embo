; PlatformIO Project Configuration File
;
; PCB Test Firmware — EMBO main board (ESP32-S3-WROOM-1-N4, soldered)
; Reads UAS + SG_RESULT sensors, drives 2x TMC2209 steppers, homes to limit
; switches, and exposes all of it over BLE (NimBLE) to a Web Bluetooth page.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	teemuatlut/TMCStepper @ ^0.7.3
	h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM=0
monitor_dtr = 1
monitor_rts = 1
