; PlatformIO Project Configuration File
;
; UAS Frequency Sweep Test Rig — EMBO main board v3.4 (ESP32-S3-WROOM-1-N4)
; Forked from testing/PCB_Test_Firmware_v3_4, with one addition: the AD9833
; drive frequency is now settable at runtime over BLE (FREQ_CMD
; characteristic), enabling a web-driven automated frequency sweep instead
; of the fixed 1MHz bring-up tone. Everything else (StallGuard, load cells,
; turbidity, motors) is carried over unchanged for reference/bring-up.
;
; See docs/EMBO_PCB_Design_Brief_v3_4.txt for the hardware this targets.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
	teemuatlut/TMCStepper @ ^0.7.3
	h2zero/NimBLE-Arduino @ ^1.4.1
	lovyan03/LovyanGFX @ ^1.1.16
	robtillaart/AD9833 @ ^0.4.5
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM=0
monitor_dtr = 1
monitor_rts = 1