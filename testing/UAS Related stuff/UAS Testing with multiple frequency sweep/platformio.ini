; PlatformIO Project Configuration File
;
; UAS Frequency Sweep Test Rig — EMBO main board v3.4 (ESP32-S3-WROOM-1-N4)
; Forked from testing/PCB_Test_Firmware_v3_4, with one addition: the AD9833
; drive frequency is now settable at runtime over BLE (FREQ_CMD
; characteristic), enabling a web-driven automated frequency sweep instead
; of the fixed 1MHz bring-up tone.
;
; Motors/homing/UI/bus-probe are EXCLUDED from this build (see
; build_src_filter below) — this rig only needs UAS + BLE, and that carried-
; over code was written against an older arduino-esp32 core (uses
; driver/rmt_rx.h, UART_SCLK_DEFAULT, ledcAttach signatures that don't match
; the framework version PlatformIO fetches fresh today). Not worth fixing
; for code this project doesn't use — force_sensor/turbidity stay in since
; they compile cleanly and are independent of the broken motor/UART code.
;
; See docs/EMBO_PCB_Design_Brief_v3_4.txt for the hardware this targets.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
	h2zero/NimBLE-Arduino @ ^1.4.1
	robtillaart/AD9833 @ ^0.4.5
build_src_filter =
	+<*>
	-<hal/motors.cpp>
	-<hal/homing.cpp>
	-<hal/tmc_uart_stream.cpp>
	-<hal/bus_probe.cpp>
	-<ui.cpp>
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM=0
monitor_dtr = 1
monitor_rts = 1