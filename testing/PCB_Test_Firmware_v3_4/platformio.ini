; PlatformIO Project Configuration File
;
; PCB Test Firmware — EMBO main board v3.4 (ESP32-S3-WROOM-1-N4)
; Reads UAS envelope, StallGuard, 2x HX711 load cells, and the APDS9960 +
; MAX30102 turbidity pair; drives 2x TMC2209 steppers; homes to limit
; switches; exposes all of it over BLE (NimBLE) to a Web Bluetooth dashboard.
;
; See docs/EMBO_PCB_Design_Brief_v3_4.txt for the hardware this targets.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
	teemuatlut/TMCStepper @ ^0.7.3
	h2zero/NimBLE-Arduino @ ^1.4.1
	lovyan03/LovyanGFX @ ^1.1.16
	robtillaart/AD9833 @ ^0.4.5
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D BOARD_HAS_PSRAM=0
monitor_dtr = 1
monitor_rts = 1