; PlatformIO Project Configuration File
;
; PCB Test Firmware — EMBO main board v3.4 (ESP32-S3-WROOM-1-N4)
; ESP-IDF-native build (no Arduino core). Reads UAS envelope, StallGuard,
; 2x HX711 load cells, and the APDS9960 + MAX30102 turbidity pair; drives
; 2x TMC2209 steppers; homes to limit switches; exposes all of it over BLE
; (native ESP-IDF NimBLE host) to a Web Bluetooth dashboard.
;
; See docs/EMBO_PCB_Design_Brief_v3_4.txt for the hardware this targets.
; See testing/PCB_Test_Firmware_v3_4/ for the Arduino-framework sibling
; project this was ported from — same behavior, different framework.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 4MB
monitor_speed = 115200
lib_deps =
	lovyan03/LovyanGFX @ ^1.1.16
build_flags =
	-D BOARD_HAS_PSRAM=0
